<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ══════════════════════════════════════════════════════
         NAVIGATION BAR
         The bottom white border is handled in style.css
         under the "nav" rule using border-bottom.
    ══════════════════════════════════════════════════════ -->
    <nav>
        <a id="logo" href="index.html">Portfolio</a>

        <div id="profile" onclick="openModal()">
            <img src="images/leon-kennedy-image.jpg" alt="Profile">
            <span>imPhlouox</span>
        </div>
    </nav>

    <!-- PROFILE MODAL (unchanged) -->
    <div id="modal-overlay">
        <div id="modal-box">
            <img src="images/leon-kennedy-image.jpg" alt="Profile">
            <h2>imPhlouox</h2>
            <p>Web Developer & Designer</p>
            <button id="modal-close" onclick="closeModal()">Close</button>
        </div>
    </div>


    <!-- ══════════════════════════════════════════════════════
         PAGE LAYOUT
         This wrapper splits the page into two columns:
         - Left: the sidebar navigation (Schedule, Haircare, Skincare)
         - Right: the content area (whichever section is active)
    ══════════════════════════════════════════════════════ -->
    <div id="page-layout">

        <!-- ── LEFT SIDEBAR NAVIGATION ───────────────────────
             Each <button> calls showSection() with the ID of
             the section it should reveal on the right side.
             The "active-nav" class highlights the selected one. -->
        <div id="sidebar">

            <button
                class="nav-btn active-nav"
                onclick="showSection('schedule-section', this)">
                Schedule
            </button>
            <!-- class="nav-btn"  → base styles for all sidebar buttons
                 class="active-nav" → highlights the currently selected button
                 onclick="showSection('schedule-section', this)"
                   → calls showSection() passing:
                      1. the ID of the section to show
                      2. "this" = the button itself, so we can highlight it -->

            <button
                class="nav-btn"
                onclick="showSection('haircare-section', this)">
                Haircare
            </button>

            <button
                class="nav-btn"
                onclick="showSection('skincare-section', this)">
                Skincare
            </button>

        </div><!-- end #sidebar -->


        <!-- ── RIGHT CONTENT AREA ────────────────────────────
             All three sections live here at the same time.
             Only one is visible — the others have display:none.
             JavaScript toggles which one shows. -->
        <div id="content-area">


            <!-- SCHEDULE SECTION (visible by default) -->
            <section id="schedule-section" class="content-section">
            <!-- class="content-section" is shared by all three sections.
                 JavaScript uses this class to find and hide all of them
                 before showing the one that was clicked. -->

                <!-- The calendar markup is unchanged from before -->
                <div id="calendar">

                    <div id="calendar-nav">
                        <button onclick="changeWeek(-1)">&#8592;</button>
                        <span id="week-label"></span>
                        <button onclick="changeWeek(1)">&#8594;</button>
                    </div>

                    <div id="calendar-headers"></div>
                    <div id="calendar-days"></div>

                </div>

            </section><!-- end #schedule-section -->


            <!-- HAIRCARE SECTION (hidden by default) -->
            <!-- HAIRCARE SECTION (hidden by default) -->
            <section id="haircare-section" class="content-section">

                <!-- ── HAIRCARE PRODUCT LIST ─────────────────────────
                     Each <div class="product-card"> is one product row.
                     To add a new product, copy one entire product-card
                     block and paste it below the last one, then fill in
                     your own image / name / price / store. -->
                <div id="haircare-list">

                    <!-- ── PRODUCT CARD ──────────────────────────────
                         Duplicate this whole block for every new item. -->
                    <div class="product-card">

                        <!-- PRODUCT IMAGE
                             Replace src="" with the path to your image
                             Replace alt="" with a short description -->
                        <img class="product-img" src="" alt="MONDAY Shampoo">

                        <!-- PRODUCT NAME
                             Type the product name between the tags,
                             e.g. Olaplex No.3 Hair Perfector -->
                        <span class="product-name">MONDAY Shampoo</span>

                        <!-- PRICE
                             Type the price between the tags,
                             e.g. $28.00 -->
                        <span class="product-price">₱ 380</span>

                        <!-- FROM (store / website)
                             Type where to buy it between the tags,
                             e.g. Sephora -->
                        <span class="product-from">Shopwise</span>

                    </div><!-- end .product-card -->

                    <div class="product-card">

                        <!-- PRODUCT IMAGE
                             Replace src="" with the path to your image,
                             e.g. src="images/shampoo.jpg"
                             Replace alt="" with a short description,
                             e.g. alt="Olaplex No.3 bottle" -->
                        <img class="product-img" src="" alt="MONDAY Conditioner">

                        <!-- PRODUCT NAME
                             Type the product name between the tags,
                             e.g. Olaplex No.3 Hair Perfector -->
                        <span class="product-name">MONDAY Conditioner</span>

                        <!-- PRICE
                             Type the price between the tags,
                             e.g. $28.00 -->
                        <span class="product-price">₱ 370</span>

                        <!-- FROM (store / website)
                             Type where to buy it between the tags,
                             e.g. Sephora -->
                        <span class="product-from">Shopwise</span>

                    </div><!-- end .product-card -->

                    <div class="product-card">

                        <!-- PRODUCT IMAGE
                             Replace src="" with the path to your image,
                             e.g. src="images/shampoo.jpg"
                             Replace alt="" with a short description,
                             e.g. alt="Olaplex No.3 bottle" -->
                        <img class="product-img" src="" alt="MONDAY Conditioner">

                        <!-- PRODUCT NAME
                             Type the product name between the tags,
                             e.g. Olaplex No.3 Hair Perfector -->
                        <span class="product-name">LUXE Leave-in Conditioner</span>

                        <!-- PRICE
                             Type the price between the tags,
                             e.g. $28.00 -->
                        <span class="product-price">₱ 179</span>

                        <!-- FROM (store / website)
                             Type where to buy it between the tags,
                             e.g. Sephora -->
                        <span class="product-from">Watsons</span>

                    </div><!-- end .product-card -->

                </div><!-- end #haircare-list -->

            </section><!-- end #haircare-section -->


            <!-- SKINCARE SECTION (hidden by default) -->
            <section id="skincare-section" class="content-section">
                <div id="skincare-list">
                    <div class="product-card">
                        <img class="product-img" src="" alt="">
                        <span class="product-name"></span>
                        <span class="product-price"></span>
                        <span class="product-from"></span>
                </div><!-- end #skincare-list -->
            </section><!-- end #skincare-section -->



        </div><!-- end #content-area -->

    </div><!-- end #page-layout -->


    <!-- ADD EVENT MODAL (unchanged) -->
    <div id="event-modal-overlay">
        <div id="event-modal-box">
            <h3>Add Event</h3>
            <p id="event-date-label"></p>
            <input type="text" id="event-input" placeholder="Event name..." />
            <div id="event-modal-buttons">
                <button onclick="saveEvent()">Save</button>
                <button onclick="closeEventModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
