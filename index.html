<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ══════════════════════════════════════════════════════
         NAVIGATION BAR (unchanged from before)
    ══════════════════════════════════════════════════════ -->
    <nav>
        <a id="logo" href="index.html">Portfolio</a>

        <div id="profile" onclick="openModal()">
            <img src="images/leon-kennedy-image.jpg" alt="Profile">
            <span>imPhlouox</span>
        </div>
    </nav>

    <!-- PROFILE MODAL (unchanged from before) -->
    <div id="modal-overlay">
        <div id="modal-box">
            <img src="images/leon-kennedy-image.jpg" alt="Profile">
            <h2>imPhlouox</h2>
            <p>Web Developer & Designer</p>
            <button id="modal-close" onclick="closeModal()">Close</button>
        </div>
    </div>


    <!-- ══════════════════════════════════════════════════════
         SCHEDULE SECTION
         This sits below the navbar on the home page.
         It is split into two sides using flexbox:
         - Left side: the "Schedule" label
         - Right side: the weekly calendar
    ══════════════════════════════════════════════════════ -->
    <section id="schedule-section">

        <!-- LEFT SIDE — just the word "Schedule" -->
        <div id="schedule-label">
            <h2>Schedule</h2>
        </div>

        <!-- RIGHT SIDE — the full calendar lives here -->
        <div id="calendar">

            <!-- WEEK NAVIGATION — arrows to go back and forward one week -->
            <div id="calendar-nav">
                <!-- Clicking these buttons calls the functions in script.js
                     that move the calendar backward or forward by 7 days -->
                <button onclick="changeWeek(-1)">&#8592;</button> <!-- Left arrow character -->

                <!-- This span is empty here — script.js fills it in with the
                     current week range (e.g. "May 12 – May 18, 2025") -->
                <span id="week-label"></span>

                <button onclick="changeWeek(1)">&#8594;</button> <!-- Right arrow character -->
            </div>

            <!-- DAY HEADERS — Mon, Tue, Wed... displayed above the day columns -->
            <div id="calendar-headers">
                <!-- script.js will generate these automatically based on the current week -->
            </div>

            <!-- DAY COLUMNS — one box per day where events will appear -->
            <div id="calendar-days">
                <!-- script.js generates 7 day columns here (Monday to Sunday).
                     Each column is clickable to add a new event. -->
            </div>

        </div>
    </section>


    <!-- ADD EVENT MODAL — appears when the user clicks on a day -->
    <div id="event-modal-overlay">
        <div id="event-modal-box">
            <h3>Add Event</h3>

            <!-- Shows which day the user clicked, e.g. "Monday, May 13" -->
            <p id="event-date-label"></p>

            <!-- Text input where the user types the event name -->
            <input type="text" id="event-input" placeholder="Event name..." />

            <div id="event-modal-buttons">
                <!-- Saves the event to that day -->
                <button onclick="saveEvent()">Save</button>

                <!-- Cancels without saving -->
                <button onclick="closeEventModal()">Cancel</button>
            </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
